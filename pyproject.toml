[project]
name = "pdf-extractext-config"
version = "0.1.0"
description = "Microservicio config de pdf-extractext: CRUD de la configuración centralizada sobre el KV de Consul"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "py-consul>=1.8.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `uv run pytest` corre solo los unitarios; `uv run pytest -m integration` pisa este filtro.
addopts = "-m 'not integration'"
markers = ["integration: pruebas contra un Consul real; se saltan si no responde"]
