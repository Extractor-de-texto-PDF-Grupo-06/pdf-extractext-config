name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      # La imagen arranca en modo desarrollo, que ya tiene líder.
      consul:
        image: hashicorp/consul:2.1
        ports:
          - 8500:8500
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Tests unitarios
        run: uv run pytest
      - name: Esperar a que Consul tenga líder
        run: timeout 60 bash -c 'until curl -sf localhost:8500/v1/status/leader | grep -q ":"; do sleep 1; done'
      - name: Tests de integración contra Consul
        run: uv run pytest -m integration
        env:
          CONSUL_URL: http://localhost:8500

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Construir la imagen
        run: docker build -t pdf-extractext-config:ci .
