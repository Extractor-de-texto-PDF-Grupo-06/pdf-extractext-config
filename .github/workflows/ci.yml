name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      # La imagen arranca en modo desarrollo, que ya tiene líder.
      consul:
        image: hashicorp/consul:2.1
        ports:
          - 8500:8500
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Tests unitarios
        run: uv run pytest
      - name: Esperar a que Consul tenga líder
        run: timeout 60 bash -c 'until curl -sf localhost:8500/v1/status/leader | grep -q ":"; do sleep 1; done'
      - name: Tests de integración contra Consul
        run: uv run pytest -m integration
        env:
          CONSUL_URL: http://localhost:8500
      - name: Auditar dependencias de produccion
        run: |
          uv export --locked --no-dev --no-hashes --format requirements-txt --output-file /tmp/requirements.txt
          uvx --from pip-audit pip-audit --requirement /tmp/requirements.txt --strict

  seguridad-imagen:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen para escaneo
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/pdf-extractext-config:ci
      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: local/pdf-extractext-config:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'

  # Construye la imagen en cada PR y push, así un Dockerfile roto se ve antes de fusionar.
  # Solo al fusionar en main la publica en ghcr con latest y el hash del commit (T11).
  docker:
    needs: [tests, seguridad-imagen]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - name: Iniciar sesión en ghcr
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir la imagen y publicarla si es main
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            ghcr.io/extractor-de-texto-pdf-grupo-06/pdf-extractext-config:latest
            ghcr.io/extractor-de-texto-pdf-grupo-06/pdf-extractext-config:${{ github.sha }}
